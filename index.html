<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1a3a">
<link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<title>Painel | Aroma e Brilho</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--azul:#1b47f5;--azul2:#0f2fb8;--ink:#0e1a3a;--bg:#f2f5ff;--sf:#fff;--lim:#ffe24a;--mut:#5b6787;--bd:#dde3f5;--ok:#0b8a5f;--warn:#a86400;--red:#d63b40;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.45}
h1,h2,h3,.big{font-family:"Bricolage Grotesque",Figtree,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input:focus{border-color:var(--azul);outline:0}
.top{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.top h1{margin:0;font-size:1.15rem;font-weight:800;letter-spacing:-.02em;flex:1}
.top h1 small{font-family:Figtree;font-weight:500;opacity:.7;font-size:.85rem;margin-left:8px}
.out{color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.88rem}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 90px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--sf);border:1.5px solid var(--bd);border-radius:16px;padding:12px 14px;text-align:left;transition:.15s}
.stat.on{border-color:var(--ink);background:var(--ink);color:#fff}
.stat .big{font-size:2rem;font-weight:800;line-height:1;letter-spacing:-.03em;display:block}
.stat span:last-child{font-size:.82rem;opacity:.75}
.tools{display:flex;gap:10px;margin-bottom:12px}
.btn{background:var(--azul);color:#fff;font-weight:700;padding:10px 18px;border-radius:99px;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--azul2)}.btn:active{transform:scale(.96)}
.ghost{border:1.5px solid var(--bd);color:var(--mut);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.88rem;background:var(--sf)}
.del{color:var(--red);border:1.5px solid var(--bd);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.82rem;background:var(--sf)}
.info{font-size:.85rem;color:var(--mut);margin:0 0 12px}
.pr{background:var(--sf);border:1.5px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hd .ic{width:54px;text-align:center;font-size:1.3rem;padding:6px}
.hd .nm{flex:1;min-width:150px;font-weight:700;font-size:1.02rem}
.hd .ct{width:150px}
.vs{margin-top:10px;display:grid;gap:8px}
.v{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;padding:10px;background:var(--bg);border-radius:14px}
.v label{font-size:.74rem;color:var(--mut);font-weight:600;display:block;margin-bottom:3px}
.pre{position:relative}.pre span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:.9rem;pointer-events:none}.pre input{padding-left:34px}
.stk{display:flex;align-items:center;gap:0}
.stk input{width:64px;text-align:center;border-radius:0;border-left:0;border-right:0;padding:9px 4px}
.stk button{width:38px;height:40px;font-size:1.2rem;font-weight:700;background:var(--ink);color:#fff}
.stk button:first-child{border-radius:10px 0 0 10px}.stk button:last-child{border-radius:0 10px 10px 0}
.stk button:active{background:var(--azul)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--ok)}
.dot.low{background:var(--warn)}.dot.out{background:var(--red)}
.tg{display:flex;align-items:center;gap:8px;grid-column:1/-1;font-size:.82rem;color:var(--mut)}
.tg .del{margin-left:auto}
.add{margin-top:10px}
details.lj{background:var(--sf);border:1.5px solid var(--bd);border-radius:20px;padding:4px 14px;margin-bottom:14px}
details.lj summary{cursor:pointer;font-weight:700;padding:12px 0;font-family:"Bricolage Grotesque"}
details.lj .g{display:grid;gap:8px;padding-bottom:14px}
.empty{background:var(--sf);border:2px dashed var(--bd);border-radius:20px;padding:34px 18px;text-align:center;color:var(--mut)}
.empty h2{color:var(--ink);margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;font-size:.9rem;font-weight:600;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--red)}
.login{min-height:100dvh;display:grid;grid-template-columns:1fr}
.lb{background:var(--azul);color:#fff;padding:36px 26px;display:flex;flex-direction:column;justify-content:flex-end;min-height:220px}
.lb h1{font-size:clamp(2.2rem,8vw,3.6rem);line-height:1;letter-spacing:-.035em;margin:0;font-weight:800}
.lb p{margin:10px 0 0;opacity:.9}
.lf{display:grid;gap:12px;align-content:center;padding:30px 26px;max-width:420px;width:100%;margin:0 auto}
.lf h2{margin:0;font-size:1.5rem;letter-spacing:-.02em}.lf .btn{padding:13px}
.err{color:var(--red);font-weight:600;font-size:.9rem;margin:0;min-height:1.3em}
.tabs{display:flex;gap:8px;background:var(--ink);padding:0 18px 12px;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:9}
.tabs button{flex:1;max-width:210px;padding:9px;border-radius:99px;color:#fff;font-weight:700;border:1.5px solid rgba(255,255,255,.3)}
.tabs button.on{background:#fff;color:var(--ink);border-color:#fff}
.tabs b{background:var(--lim);color:var(--ink);border-radius:99px;padding:0 9px;margin-left:8px;font-size:.8rem}.tabs b:empty{display:none}
.tools2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.od{background:var(--sf);border:1.5px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px;display:grid;gap:10px}
.od.nv{border-color:var(--azul);box-shadow:0 0 0 4px rgba(27,71,245,.12);animation:pulse 1.6s 3}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(27,71,245,0)}}
.oh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.oh h3{margin:0;font-size:1.2rem}.oh time{margin-left:auto;color:var(--mut);font-size:.85rem}
.bg{border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700}
.s_novo{background:var(--lim)}.s_confirmado{background:#d3e0ff;color:var(--azul2)}.s_entrega{background:#d3f4e4;color:var(--ok)}.s_entregue{background:var(--ok);color:#fff}.s_cancelado{background:#ffdcd6;color:var(--red)}
.cl{margin:0}.oi{list-style:none;margin:0;padding:10px 0;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);display:grid;gap:4px}.oi li{display:flex;justify-content:space-between;gap:10px}
.pgm,.ob{margin:0;font-size:.92rem}.ob{color:var(--mut)}
.ot{display:flex;justify-content:space-between;font-family:"Bricolage Grotesque";font-weight:800;font-size:1.35rem}
.oa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lk{text-decoration:none;display:inline-block}
.lg{width:34px;height:34px;border-radius:50%;margin-right:10px;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.lgb{width:110px;height:110px;border-radius:50%;margin-bottom:18px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;resize:vertical}
textarea:focus{border-color:var(--azul);outline:0}
.l2{font-size:.82rem;color:var(--mut);font-weight:600;margin:6px 0 -2px}
.fora{color:var(--warn);font-weight:600;font-size:.86rem;margin:0}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}
.seg2 button{padding:9px;border-radius:10px;font-weight:700}.seg2 button.on{background:var(--ink);color:#fff}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kp div{background:var(--sf);border:1.5px solid var(--bd);border-radius:16px;padding:12px 14px}
.kp b{display:block;font-family:"Bricolage Grotesque";font-size:1.5rem;letter-spacing:-.03em;line-height:1.1}.kp span{font-size:.8rem;color:var(--mut)}
.bx{background:var(--sf);border:1.5px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.bx h3{margin:0 0 10px;font-size:1.05rem}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars i{display:block;width:100%;background:var(--azul);border-radius:5px 5px 0 0;min-height:2px;transition:height .4s}
.bars small{font-size:.66rem;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden}
.rk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-bottom:9px;font-size:.92rem}
.rk u{grid-column:1/-1;height:6px;border-radius:99px;background:var(--bg);text-decoration:none;overflow:hidden}.rk u i{display:block;height:100%;background:var(--lim)}
.rk span:last-child{color:var(--mut);font-weight:600}
.nt{font-size:.8rem;color:var(--mut);margin:0 0 12px}
@media(min-width:820px){.login{grid-template-columns:1.1fr 1fr}.lb{justify-content:flex-end;padding:56px}}
@media(max-width:520px){.v{grid-template-columns:1fr 1fr}.v .stk{grid-column:1/-1}.hd .ct{width:100%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="st" role="status"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,setDoc,deleteDoc,updateDoc,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCGFv2xrJveqk4gR_OeRCqj1aJVT_atEQ8",authDomain:"aroma-e-brilho.firebaseapp.com",projectId:"aroma-e-brilho",storageBucket:"aroma-e-brilho.firebasestorage.app",messagingSenderId:"674882407782",appId:"1:674882407782:web:a6727100592d3813310ca7"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let prods=[],loja={end:"",hor:""},unsubs=[],lastKey="",filtro="todos",busca="",pedidos=[],aba="pedidos",fp="novo",primeira=true,som=true,actx=null;
const brl=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
document.addEventListener("click",()=>{try{actx=actx||new AudioContext();actx.resume()}catch(e){}});
const e0=v=>Math.max(0,parseInt(v.e)||0);
const SEED=[["🧴","Alvejante","Líquidos",[["5L",12]]],["🧼","Sabão","Líquidos",[["5L",10]]],["🌸","Amaciante","Líquidos",[["5L",10]]],["🍽️","Detergente","Líquidos",[["5L",10]]],["💧","Água sanitária","Líquidos",[["5L",8]]],["✨","Desinfetante","Líquidos",[["1L",3.5],["2L",5]]],["🗑️","Pá","Utensílios",[["",6]]],["🧹","Vassoura","Utensílios",[["",8]]],["🪣","Rodo","Utensílios",[["30cm",6],["40cm",8]]]];

function msg(t,bad,ms){const s=$("st");s.textContent=t;s.classList.toggle("bad",!!bad);s.classList.add("on");clearTimeout(s._t);s._t=setTimeout(()=>s.classList.remove("on"),ms||1800)}
const erro=e=>msg("Não salvou: "+(e.code||e.message),1);
const save=async p=>{try{await setDoc(doc(db,"produtos",String(p.id)),p);msg("Alteração salva")}catch(e){erro(e)}};

function loginView(err){
  $("app").innerHTML=`<div class="login"><div class="lb"><img class="lgb" src="logo.png" alt=""><h1>Aroma e Brilho</h1><p>Painel do dono: preços, estoque e produtos da loja.</p></div>
  <form class="lf" id="f"><h2>Entrar</h2><input id="em" type="email" placeholder="E-mail" autocomplete="username" required aria-label="E-mail">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" required aria-label="Senha">
  <p class="err" role="alert">${err||""}</p><button class="btn">Entrar no painel</button></form></div>`;
  $("f").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("em").value,$("pw").value)}catch(x){loginView("E-mail ou senha incorretos. Confira e tente de novo.")}};
}

function stats(){if(!$("stats"))return;
  const n=prods.length,out=prods.filter(p=>p.vars.some(v=>e0(v)<=0)).length,low=prods.filter(p=>p.vars.some(v=>e0(v)>0&&e0(v)<=5)).length;
  const S=[["todos",n,"Produtos"],["baixo",low,"Estoque baixo"],["esgotado",out,"Com esgotado"]];
  $("stats").innerHTML=S.map(([k,v,t])=>`<button class="stat ${filtro===k?"on":""}" onclick="setF('${k}')"><span class="big">${v}</span><span>${t}</span></button>`).join("");
}
function lista(){if(!$("lista"))return;
  const q=busca.trim().toLowerCase();
  const ok=p=>p.nome.toLowerCase().includes(q)&&(filtro==="todos"||(filtro==="esgotado"&&p.vars.some(v=>e0(v)<=0))||(filtro==="baixo"&&p.vars.some(v=>e0(v)>0&&e0(v)<=5)));
  const cats=[...new Set(prods.map(p=>p.cat))];
  const h=prods.map((p,i)=>ok(p)?`<div class="pr"><div class="hd">
    <input class="ic" value="${esc(p.ico)}" aria-label="Ícone" onchange="setP(${i},'ico',this.value)">
    <input class="nm" value="${esc(p.nome)}" aria-label="Nome" onchange="setP(${i},'nome',this.value)">
    <input class="ct" list="cats" placeholder="Categoria" value="${esc(p.cat)}" aria-label="Categoria" onchange="setP(${i},'cat',this.value)"></div>
    <div class="vs">${p.vars.map((v,j)=>{const e=e0(v),c=e<=0?"out":e<=5?"low":"";return `<div class="v">
      <div><label>Tamanho</label><input value="${esc(v.t)}" placeholder="Ex.: 5L" onchange="setV(${i},${j},'t',this.value)"></div>
      <div><label>Preço</label><div class="pre"><span>R$</span><input type="number" step="0.01" min="0" value="${v.p}" onchange="setV(${i},${j},'p',this.value)"></div></div>
      <div><label>Estoque</label><div class="stk"><button aria-label="Diminuir" onclick="step(${i},${j},-1)">−</button><input id="e_${i}_${j}" type="number" min="0" value="${e}" onchange="setV(${i},${j},'e',this.value)"><button aria-label="Aumentar" onclick="step(${i},${j},1)">+</button></div></div>
      <div class="tg"><span id="s_${i}_${j}"><i class="dot ${c}"></i>${e<=0?"Esgotado":e<=5?"Estoque baixo":"Em estoque"}</span>${p.vars.length>1?`<button class="del" onclick="delV(${i},${j})">Remover tamanho</button>`:""}</div></div>`}).join("")}</div>
    <div class="hd add"><button class="ghost" onclick="addV(${i})">Adicionar tamanho</button><button class="del" style="margin-left:auto" onclick="remover(${i})">Remover produto</button></div></div>`:"").join("");
  $("lista").innerHTML=(h.trim()?h:prods.length?`<div class="empty"><h2>Nada encontrado</h2>Mude a busca ou o filtro acima.</div>`:`<div class="empty"><h2>Nenhum produto ainda</h2><p>Comece com os produtos que já combinamos ou crie o primeiro.</p><button class="btn" onclick="importar()">Importar produtos iniciais</button></div>`)+`<datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`;
  stats();
}
function panel(){
  $("app").innerHTML=`<header class="top"><h1><img class="lg" src="logo.png" alt="">Aroma e Brilho<small>Painel</small></h1><button class="out" id="inst" hidden>Instalar</button><button class="out" id="out">Sair</button></header>
  <nav class="tabs"><button id="t_p" onclick="setAba('pedidos')">Pedidos<b id="nbp"></b></button><button id="t_r" onclick="setAba('produtos')">Produtos</button><button id="t_v" onclick="setAba('vendas')">Vendas</button></nav><main class="wrap" id="mn"></main>`;
  $("out").onclick=()=>signOut(auth);
  mostrar();
}
function mostrar(){
  if(!$("mn"))return;
  $("t_p").classList.toggle("on",aba==="pedidos");$("t_r").classList.toggle("on",aba==="produtos");$("t_v").classList.toggle("on",aba==="vendas");
  aba==="pedidos"?pedidosView():aba==="vendas"?vendasView():produtosView();badge();
}
function produtosView(){
  $("mn").innerHTML=`<div class="stats" id="stats"></div>
  <details class="lj"><summary>Dados da loja e bairros atendidos</summary><div class="g">
    <input id="l_end" placeholder="Endereço" value="${esc(loja.end)}" aria-label="Endereço" onchange="setLoja('end',this.value)">
    <input id="l_hor" placeholder="Horário, ex.: Seg a Sáb, 8h às 18h" value="${esc(loja.hor)}" aria-label="Horário" onchange="setLoja('hor',this.value)">
    <p class="l2">Bairros com entrega grátis, um por linha</p><textarea id="l_bairros" rows="4" placeholder="Vila Velha&#10;Jardim Iracema" onchange="setBairros(this.value)">${esc((loja.bairros||[]).join("\n"))}</textarea></div></details>
  <div class="tools"><input type="search" id="bq" placeholder="Buscar produto" aria-label="Buscar produto" value="${esc(busca)}"><button class="btn" onclick="novo()">Novo produto</button></div>
  <p class="info">Tudo é salvo na hora e já aparece no site dos clientes.</p><div id="lista"></div>`;
  $("bq").oninput=e=>{busca=e.target.value;lista()};
  lista();
}
/* ---- vendas ---- */
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
let per=7;
function vendasView(){
  $("mn").innerHTML=`<div class="seg2" id="pr"><button data-d="1">Hoje</button><button data-d="7">7 dias</button><button data-d="30">30 dias</button></div><div id="rv"></div>`;
  document.querySelectorAll("#pr button").forEach(b=>{b.classList.toggle("on",+b.dataset.d===per);b.onclick=()=>{per=+b.dataset.d;vendasView()}});
  relat();
}
function relat(){
  if(!$("rv"))return;
  const ini=new Date();ini.setHours(0,0,0,0);ini.setDate(ini.getDate()-(per-1));
  const v=pedidos.filter(o=>o.criadoEm>=ini.getTime()&&["confirmado","entrega","entregue"].includes(o.status));
  const tot=v.reduce((a,o)=>a+(o.total||0),0),n=v.length;
  const dias=[];for(let i=0;i<per;i++){const d=new Date(ini);d.setDate(d.getDate()+i);dias.push({d,t:0})}
  v.forEach(o=>{const d=new Date(o.criadoEm);d.setHours(0,0,0,0);const x=dias.find(y=>y.d.getTime()===d.getTime());if(x)x.t+=o.total||0});
  const mx=Math.max(1,...dias.map(x=>x.t));
  const agr=(f)=>{const m={};v.forEach(o=>f(o).forEach(([k,q,val])=>{m[k]=m[k]||{q:0,val:0};m[k].q+=q;m[k].val+=val}));return Object.entries(m).sort((a,b)=>b[1].q-a[1].q).slice(0,6)};
  const prod=agr(o=>(o.itens||[]).map(i=>[i.nome,i.q,i.q*i.p]));
  const bai=agr(o=>[[(o.cliente||{}).bairro||"Sem bairro",1,o.total||0]]);
  const rk=(l,u)=>l.length?l.map(([k,x])=>`<div class="rk"><span>${esc(k)}</span><span>${u(x)}</span><u><i style="width:${Math.round(x.q/l[0][1].q*100)}%"></i></u></div>`).join(""):`<p class="nt">Sem vendas neste período.</p>`;
  const din=v.filter(o=>o.pag==="Dinheiro").length;
  const baixo=[];prods.forEach(p=>p.vars.forEach(x=>{if(e0(x)<=5)baixo.push([(p.nome+" "+(x.t||"")).trim(),e0(x)])}));baixo.sort((a,b)=>a[1]-b[1]);
  $("rv").innerHTML=`<div class="kp"><div><b>${brl(tot)}</b><span>Vendido</span></div><div><b>${n}</b><span>${n===1?"Pedido":"Pedidos"}</span></div><div><b>${brl(n?tot/n:0)}</b><span>Ticket médio</span></div></div>
  <p class="nt">Contam os pedidos confirmados, a caminho e entregues. Novos e cancelados ficam de fora.${pedidos.length>=400?" Mostrando só os últimos 400 pedidos.":""}</p>
  ${per>1?`<div class="bx"><h3>Vendas por dia</h3><div class="bars">${dias.map(x=>`<div title="${x.d.toLocaleDateString("pt-BR")}: ${brl(x.t)}"><i style="height:${Math.round(x.t/mx*100)}%"></i><small>${per<=7?x.d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""):(x.d.getDate()%5===0?x.d.getDate():"")}</small></div>`).join("")}</div></div>`:""}
  <div class="bx"><h3>Mais vendidos</h3>${rk(prod,x=>x.q+" un. · "+brl(x.val))}</div>
  <div class="bx"><h3>Bairros que mais pedem</h3>${rk(bai,x=>x.q+(x.q===1?" pedido":" pedidos"))}</div>
  <div class="bx"><h3>Pagamento</h3><p style="margin:0">Dinheiro: <b>${din}</b> &nbsp; Pix: <b>${n-din}</b></p></div>
  <div class="bx"><h3>Acabando no estoque</h3>${baixo.length?baixo.slice(0,10).map(([k,q])=>`<div class="rk"><span>${esc(k)}</span><span>${q?q+" un.":"Esgotado"}</span></div>`).join("")+`<button class="ghost" onclick="setAba('produtos')">Ajustar estoque</button>`:`<p class="nt">Nenhum produto com estoque baixo.</p>`}</div>`;
}
/* ---- pedidos ---- */
const ST={novo:"Novo",confirmado:"Confirmado",entrega:"Saiu para entrega",entregue:"Entregue",cancelado:"Cancelado"};
const grp=s=>s==="novo"?"novo":(s==="confirmado"||s==="entrega")?"andamento":"final";
function pedidosView(){
  const perm=typeof Notification!=="undefined"?Notification.permission:"denied";
  $("mn").innerHTML=`<div class="stats" id="ps"></div><div class="tools2"><button class="ghost" id="sm">${som?"Som do aviso: ligado":"Som do aviso: desligado"}</button><button class="ghost" id="nt">${perm==="granted"?"Avisos do navegador: ativos":"Ativar avisos do navegador"}</button></div><div id="pl"></div>`;
  $("sm").onclick=()=>{som=!som;if(som)beep();pedidosView()};
  $("nt").onclick=async()=>{if(typeof Notification!=="undefined"){await Notification.requestPermission();pedidosView()}};
  listaPed();
}
function listaPed(){
  if(!$("ps"))return;
  const c={novo:0,andamento:0,final:0};pedidos.forEach(o=>c[grp(o.status)]++);
  $("ps").innerHTML=[["novo","Novos"],["andamento","Em andamento"],["final","Finalizados"]].map(([k,t])=>`<button class="stat ${fp===k?"on":""}" onclick="setFP('${k}')"><span class="big">${c[k]}</span><span>${t}</span></button>`).join("");
  const ls=pedidos.filter(o=>grp(o.status)===fp);
  $("pl").innerHTML=ls.length?ls.map(card).join(""):`<div class="empty"><h2>${fp==="novo"?"Nenhum pedido novo":"Nada por aqui"}</h2>${fp==="novo"?"Quando um cliente fizer um pedido, ele aparece aqui e você recebe um aviso.":"Os pedidos desta etapa aparecem aqui."}</div>`;
}
function card(o){
  const h=new Date(o.criadoEm).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  const c=o.cliente||{},bl=loja.bairros||[],fora=bl.length&&!bl.some(b=>norm(b)===norm(c.bairro)),tel=String(c.tel||"").replace(/\D/g,""),wa=tel?"https://wa.me/"+(tel.length<=11?"55":"")+tel:"";
  const pg=o.pag==="Dinheiro"?(o.troco?`Dinheiro, troco para ${brl(o.troco)} (levar ${brl(o.troco-o.total)})`:"Dinheiro, sem troco"):"Pix";
  const B={novo:[["confirmado","Confirmar pedido"]],confirmado:[["entrega","Saiu para entrega"]],entrega:[["entregue","Marcar como entregue"]]}[o.status]||[];
  return `<article class="od ${o.status==="novo"?"nv":""}"><div class="oh"><h3>Pedido ${esc(o.codigo)}</h3><span class="bg s_${o.status}">${ST[o.status]}</span><time>${h}</time></div>
  <p class="cl"><b>${esc(c.nome)}</b><br>${esc(c.bairro)}, ${esc(c.rua)}</p>${fora?`<p class="fora">Bairro fora da lista de entrega grátis. Confirme a entrega e o valor com o cliente.</p>`:""}
  <ul class="oi">${(o.itens||[]).map(i=>`<li><span>${i.q}x ${esc(i.nome)}</span><span>${brl(i.q*i.p)}</span></li>`).join("")}</ul>
  <p class="pgm">${pg}</p>${o.obs?`<p class="ob">Obs: ${esc(o.obs)}</p>`:""}
  <div class="ot"><span>Total</span><span>${brl(o.total)}</span></div>
  <div class="oa">${B.map(([st,t])=>`<button class="btn" onclick="mudarStatus('${o.id}','${st}')">${t}</button>`).join("")}
  ${wa?`<a class="ghost lk" target="_blank" rel="noopener" href="${wa}">Chamar no WhatsApp</a>`:""}
  ${B.length?`<button class="del" style="margin-left:auto" onclick="if(confirm('Cancelar o pedido ${esc(o.codigo)}?'))mudarStatus('${o.id}','cancelado')">Cancelar pedido</button>`:""}</div></article>`;
}
function badge(){
  const n=pedidos.filter(o=>o.status==="novo").length;
  if($("nbp"))$("nbp").textContent=n||"";
  document.title=(n?`(${n}) `:"")+"Painel | Aroma e Brilho";
}
function beep(){
  if(!som||!actx)return;
  try{[880,1175,880,1175].forEach((f,k)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+k*.2;o.frequency.value=f;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)})}catch(e){}
}
function avisar(o){
  beep();
  const t=`Novo pedido ${o.codigo}: ${(o.cliente||{}).nome||""}, ${brl(o.total)}`;
  msg(t,false,9000);
  try{if(typeof Notification!=="undefined"&&Notification.permission==="granted")new Notification("Novo pedido na Aroma e Brilho",{body:t})}catch(e){}
}
async function ajustar(o,sinal){
  const tocados=new Map();
  for(const it of o.itens||[]){const p=prods.find(x=>x.id===it.pid),v=p&&p.vars[it.vi];if(!v)continue;v.e=Math.max(0,e0(v)+sinal*it.q);tocados.set(p.id,p)}
  await Promise.all([...tocados.values()].map(p=>setDoc(doc(db,"produtos",String(p.id)),p)));
}
async function mudarStatus(id,st){
  const o=pedidos.find(x=>x.id===id);if(!o)return;
  const up={status:st};
  try{
    if(st==="confirmado"&&!o.baixado){await ajustar(o,-1);up.baixado=true}
    if(st==="cancelado"&&o.baixado){await ajustar(o,1);up.baixado=false}
    await updateDoc(doc(db,"pedidos",id),up);
    msg(st==="confirmado"?"Pedido confirmado. Estoque atualizado.":st==="cancelado"?"Pedido cancelado":"Status atualizado");
    lista();
  }catch(e){erro(e)}
}
Object.assign(window,{
  setAba:k=>{aba=k;mostrar()},setBairros:v=>{loja.bairros=v.split("\n").map(x=>x.trim()).filter(Boolean);setDoc(doc(db,"config","loja"),loja).then(()=>msg("Bairros salvos")).catch(erro)},setFP:k=>{fp=k;listaPed()},mudarStatus,
  setF:k=>{filtro=k;lista()},
  setLoja:(k,v)=>{loja[k]=v;setDoc(doc(db,"config","loja"),loja).then(()=>msg("Alteração salva")).catch(erro)},
  setP:(i,k,v)=>{prods[i][k]=v;save(prods[i]);if(k==="cat")lista()},
  setV:(i,j,k,v)=>{prods[i].vars[j][k]=k==="t"?v:k==="e"?(parseInt(v)||0):(parseFloat(v)||0);save(prods[i]);if(k==="e")lista()},
  step:(i,j,d)=>{const n=Math.max(0,e0(prods[i].vars[j])+d);prods[i].vars[j].e=n;const el=$(`e_${i}_${j}`);if(el)el.value=n;const s=$(`s_${i}_${j}`);if(s)s.innerHTML=`<i class="dot ${n<=0?"out":n<=5?"low":""}"></i>${n<=0?"Esgotado":n<=5?"Estoque baixo":"Em estoque"}`;stats();save(prods[i])},
  addV:i=>{prods[i].vars.push({t:"",p:0,e:0});save(prods[i]);lista()},
  delV:(i,j)=>{prods[i].vars.splice(j,1);save(prods[i]);lista()},
  novo:()=>{const id=Date.now();save({id,ordem:id,ico:"🧴",nome:"Novo produto",cat:prods[0]?.cat||"Líquidos",vars:[{t:"",p:0,e:0}]})},
  remover:async i=>{if(confirm("Remover "+prods[i].nome+"? Essa ação não tem volta."))try{await deleteDoc(doc(db,"produtos",String(prods[i].id)));msg("Produto removido")}catch(e){erro(e)}},
  importar:async()=>{try{await setDoc(doc(db,"config","loja"),{end:"Alameda Girassol, 1027 - Bairro Vila Velha",hor:""})}catch(e){erro(e);return}
    for(let n=0;n<SEED.length;n++){const [ico,nome,cat,vs]=SEED[n];await save({id:n+1,ordem:n+1,ico,nome,cat,vars:vs.map(([t,p])=>({t,p,e:10}))})}
    msg("Produtos importados. Ajuste o estoque de cada um.")}
});

onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f());unsubs=[];lastKey="";
  if(!u){loginView();return}
  panel();primeira=true;pedidos=[];
  unsubs.push(onSnapshot(query(collection(db,"pedidos"),orderBy("criadoEm","desc"),limit(400)),s=>{
    pedidos=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!primeira)s.docChanges().forEach(c=>{if(c.type==="added"&&c.doc.data().status==="novo")avisar(c.doc.data())});
    primeira=false;listaPed();badge();if(aba==="vendas")relat();
  },erro));
  unsubs.push(onSnapshot(collection(db,"produtos"),s=>{
    prods=s.docs.map(d=>d.data()).sort((a,b)=>(a.ordem||a.id)-(b.ordem||b.id));
    const key=prods.map(p=>p.id+":"+p.vars.length).join();
    if(key!==lastKey){lastKey=key;lista()}
    if(aba==="vendas")relat();
  }));
  unsubs.push(onSnapshot(doc(db,"config","loja"),s=>{loja={end:"",hor:"",...(s.data()||{})};for(const k of["end","hor"]){const el=$("l_"+k);if(el&&document.activeElement!==el)el.value=loja[k]||""}}));
});
</script>

addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;const b=document.getElementById("inst");if(b)b.hidden=false});
document.addEventListener("click",async e=>{if(e.target.id==="inst"&&ip){ip.prompt();await ip.userChoice;ip=null;e.target.hidden=true}});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
