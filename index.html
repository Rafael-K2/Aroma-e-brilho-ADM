:root{--azul:#19647e;--azul2:#0f4a60;--ink:#0b2f40;--ink2:#0a374c;--bg:#eef8fb;--sf:#fff;--lim:#f0c85a;--lim2:#ffe9a6;--aqua:#6fd0e6;--foam:#dff3f8;--mut:#55707c;--bd:#d3e6ee;--ok:#0b7f5a;--warn:#a86400;--red:#c9363b;--hh:60px;
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.4,.5,1);
 --sh:0 1px 0 rgba(11,47,64,.03),0 10px 24px -14px rgba(11,47,64,.22);--sh2:0 2px 0 rgba(11,47,64,.03),0 20px 36px -18px rgba(11,47,64,.34);
 --f-d:"Bricolage Grotesque",system-ui,sans-serif;--f-b:"Instrument Sans",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;min-height:100dvh;overflow-x:clip;background:radial-gradient(60rem 28rem at 100% 8rem,rgba(111,208,230,.2),transparent 60%),radial-gradient(40rem 26rem at -10% 44rem,rgba(240,200,90,.12),transparent 60%),var(--bg);color:var(--ink);font-family:var(--f-b);line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big{font-family:var(--f-d)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;min-width:0;transition:border-color .2s,box-shadow .25s}
textarea{resize:vertical}
input:focus,textarea:focus{border-color:var(--azul);outline:0;box-shadow:0 0 0 4px rgba(25,100,126,.14)}
input::placeholder,textarea::placeholder{color:#7f97a2}
/* ícones em máscara */
.top .out::before,.tabs button::before,.btn::before,.ghost::before,.del::before,.stat::after,.empty::before,.alerta::before,.toast::before,details.lj summary::after,.fotob span::before,.stk button::before{content:"";display:inline-block;flex:none;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat}
/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:10;height:calc(var(--hh) + env(safe-area-inset-top,0px));background:rgba(10,55,76,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;display:flex;align-items:center;gap:10px;padding:0 18px;padding-top:env(safe-area-inset-top,0px)}
.top h1{margin:0;font-size:1.18rem;font-weight:800;letter-spacing:-.025em;flex:1;display:flex;align-items:center}
.top h1 small{font-family:var(--f-b);font-weight:600;font-size:.74rem;margin-left:10px;background:var(--lim);color:var(--ink);padding:2px 10px;border-radius:99px;letter-spacing:0;text-transform:uppercase;letter-spacing:.06em}
.lg{width:38px;height:38px;border-radius:50%;margin-right:11px;vertical-align:middle;box-shadow:0 0 0 2px var(--lim),0 6px 14px rgba(0,0,0,.3)}
button.out{color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:7px;transition:background .2s}
button.out:hover{background:rgba(255,255,255,.14)}
button.out::before{width:15px;height:15px;--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m16 17 5-5-5-5%22 /%3E%0A  %3Cpath d=%22M21 12H9%22 /%3E%0A  %3Cpath d=%22M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4%22 /%3E%3C/svg%3E")}
#inst::before{--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 15V3%22 /%3E%0A  %3Cpath d=%22M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4%22 /%3E%0A  %3Cpath d=%22m7 10 5 5 5-5%22 /%3E%3C/svg%3E")}
button.out[hidden]{display:none}
.tabs{display:flex;gap:8px;background:rgba(10,55,76,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 18px 12px;position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:9}
.tabs button{flex:1;max-width:210px;padding:10px 8px;border-radius:14px;color:rgba(255,255,255,.88);font-weight:700;border:1.5px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;gap:8px;transition:background .3s var(--ease),color .3s,border-color .3s,transform .25s var(--spring)}
.tabs button::before{width:18px;height:18px}

M3 3v16a2 2 0 0 0 2 2h16%22 /%3E%0A  %3Cpath d=%22M18 17V9%22 /%3E%0A  %3Cpath d=%22M13 17V5%22 /%3E%0A  %3Cpath d=%22M8 17v-3%22 /%3E%3C/svg%3E")}
.tabs button:hover{transform:translateY(-1px)}
.tabs button.on{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 10px 20px -10px rgba(0,0,0,.6)}
.tabs b{background:var(--lim);color:var(--ink);border-radius:99px;padding:0 9px;margin-left:2px;font-size:.8rem;display:inline-block}.tabs b:empty{display:none}
/* ---------- base ---------- */
.wrap{max-width:940px;margin:0 auto;padding:20px 14px 90px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:14px 14px 13px;text-align:left;box-shadow:var(--sh);transition:transform .3s var(--spring),background .3s,color .3s,box-shadow .3s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh2)}

.lb h1{font-size:clamp(2.4rem,8vw,3.8rem);line-height:1;letter-spacing:-.04em;margin:0;font-weight:800;animation:rise .9s var(--ease) backwards .1s}
.lb p{margin:12px 0 0;opacity:.92;max-width:26em;animation:fade .9s .5s backwards}
.lgb{width:112px;height:112px;border-radius:50%;margin-bottom:20px;box-shadow:0 0 0 7px rgba(255,255,255,.1),0 0 0 17px rgba(255,255,255,.05),0 22px 44px rgba(0,0,0,.4);animation:grow .9s .2s var(--spring) backwards,bob 7s 1.3s ease-in-out infinite}
.ls .lb h1,.ls .lb p,.ls .lgb{animation:none}
.bub{position:absolute;z-index:-1;bottom:-70px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;opacity:0;pointer-events:none;
 background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.8) 0 9%,rgba(255,255,255,.14) 28%,rgba(255,255,255,.03) 70%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);animation:up var(--t) var(--d) linear infinite}
.lf{display:grid;gap:13px;align-content:center;padding:30px 26px;max-width:430px;width:100%;margin:0 auto}
.lf h2{margin:0;font-size:1.7rem;letter-spacing:-.03em}.lf .btn{padding:14px;font-size:1.02rem}
.lf input{padding:14px 14px 14px 46px;border-radius:14px;background:#fff url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2355707c%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7%22 /%3E%0A  %3Crect x=%222%22 y=%224%22 width=%2220%22 height=%2216%22 rx=%222%22 /%3E%3C/svg%3E") 15px 50%/19px no-repeat}
.lf input[type=password]{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2355707c%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Crect width=%2218%22 height=%2211%22 x=%223%22 y=%2211%22 rx=%222%22 ry=%222%22 /%3E%0A  %3Cpath d=%22M7 11V7a5 5 0 0 1 10 0v4%22 /%3E%3C/svg%3E")}
.lf .btn::after{display:none}
.lf .btn::before{width:0}
.err{color:var(--red);font-weight:600;font-size:.9rem;margin:0;min-height:1.3em}
.err:not(:empty){animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
/* ---------- pedidos ---------- */
.tools2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.od{position:relative;overflow:hidden;background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:18px 18px 16px 22px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--sh);--ac:var(--bd)}
.od::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac)}
.od.st_novo{--ac:var(--lim)}.od.st_confirmado{--ac:#3b6fe0}.od.st_entrega{--ac:#17a35b}.od.st_entregue{--ac:var(--ok)}.od.st_cancelado{--ac:var(--red)}
.od.nv{border-color:#e6c25a;box-shadow:0 0 0 4px rgba(240,200,90,.2),var(--sh);animation:pulse 1.6s 3}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(240,200,90,0),var(--sh)}}
.oh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.oh h3{margin:0;font-size:1.25rem;letter-spacing:-.02em}.oh time{margin-left:auto;color:var(--mut);font-size:.85rem;font-weight:600}
.bg{border-radius:99px;padding:3px 12px;font-size:.8rem;font-weight:700}
.s_novo{background:var(--lim)}.s_confirmado{background:#d3e0ff;color:var(--azul2)}.s_entrega{background:#d3f4e4;color:var(--ok)}.s_entregue{background:var(--ok);color:#fff}.s_cancelado{background:#ffdcd6;color:var(--red)}
.cl{margin:0;line-height:1.35}.oi{list-style:none;margin:0;padding:11px 0;border-top:1px dashed var(--bd);border-bottom:1px dashed var(--bd);display:grid;gap:5px}.oi li{display:flex;justify-content:space-between;gap:10px;font-weight:500}.oi li span:last-child{font-family:var(--f-d);font-weight:700}
.pgm,.ob{margin:0;font-size:.92rem}.ob{color:var(--mut)}
.ot{display:flex;justify-content:space-between;font-family:var(--f-d);font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.oa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.lk{text-decoration:none;display:inline-flex}
.alerta{background:var(--red);color:#fff;padding:13px 18px;font-weight:600;font-size:.92rem;line-height:1.4;display:flex;gap:11px;align-items:flex-start}
.alerta::before{width:20px;height:20px;margin-top:1px;--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3%22 /%3E%0A  %3Cpath d=%22M12 9v4%22 /%3E%0A  %3Cpath d=%22M12 17h.01%22 /%3E%3C/svg%3E")}
/* horários / switches */
.hrw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.hrw label{width:122px;font-weight:600;display:flex;gap:10px;align-items:center}
.hrw input[type=time]{width:132px}
.chk{display:flex;gap:11px;align-items:center;font-weight:600;margin-top:10px}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:40px!important;height:24px;border-radius:99px;background:#b9d0da;position:relative;cursor:pointer;transition:background .25s;border:0;padding:0;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.28);transition:transform .3s var(--spring)}
input[type=checkbox]:checked{background:var(--azul)}input[type=checkbox]:checked::after{transform:translateX(16px)}
.chk input:checked{background:var(--red)}
.fotob{width:56px;height:56px;border-radius:14px;border:1.5px dashed #9cc3d2;display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:.68rem;color:var(--mut);flex:none;text-align:center;line-height:1.1;background:var(--foam);transition:border-color .2s,background .2s,transform .3s var(--spring)}
.fotob:hover{border-color:var(--azul);transform:scale(1.05)}
.fotob span::before{display:block;width:20px;height:20px;margin:0 auto 2px;color:var(--azul);--i:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22black%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M16 5h6%22 /%3E%0A  %3Cpath d=%22M19 2v6%22 /%3E%0A  %3Cpath d=%22M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5%22 /%3E%0A  %3Cpath d=%22m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21%22 /%3E%0A  %3Ccircle cx=%229%22 cy=%229%22 r=%222%22 /%3E%3C/svg%3E")}
.fotob img{width:100%;height:100%;object-fit:cover}
.l2{font-size:.82rem;color:var(--mut);font-weight:700;margin:8px 0 -2px;letter-spacing:.02em}
.fora{color:var(--warn);font-weight:600;font-size:.86rem;margin:0;background:#fff6d6;border-radius:10px;padding:7px 11px}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:4px;margin-bottom:14px;gap:4px;box-shadow:var(--sh)}
.seg2 button{padding:10px;border-radius:12px;font-weight:700;transition:background .3s,color .3s,box-shadow .3s}.seg2 button.on{background:var(--ink);color:#fff;box-shadow:0 8px 14px -8px rgba(11,47,64,.7)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:14px 15px;box-shadow:var(--sh)}
.kp div:first-child{background:linear-gradient(160deg,#134a63,var(--ink));color:#fff;border-color:var(--ink)}.kp div:first-child span{color:rgba(255,255,255,.75)}
.kp b{display:block;font-family:var(--f-d);font-size:1.6rem;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}.kp span{font-size:.8rem;color:var(--mut);font-weight:600}
.bx{background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.bx h3{margin:0 0 12px;font-size:1.08rem;letter-spacing:-.02em}
.bars{display:flex;align-items:flex-end;gap:5px;height:140px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars i{display:block;width:100%;background:linear-gradient(180deg,var(--aqua),var(--azul));border-radius:7px 7px 3px 3px;min-height:3px;transform-origin:bottom;animation:growy .8s var(--ease) backwards;animation-delay:calc(var(--n,0)*35ms)}
.bars div:hover i{filter:brightness(1.12)}
.bars small{font-size:.66rem;color:var(--mut);margin-top:5px;white-space:nowrap;overflow:hidden;font-weight:600}
@keyframes growy{from{transform:scaleY(0)}}
.rk{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin-bottom:11px;font-size:.92rem;font-weight:500}
.rk u{grid-column:1/-1;height:7px;border-radius:99px;background:var(--bg);text-decoration:none;overflow:hidden}.rk u i{display:block;height:100%;background:linear-gradient(90deg,var(--lim),#f7dc8e);border-radius:99px;transform-origin:left;animation:fillx .9s var(--ease) backwards}
.rk span:last-child{color:var(--mut);font-weight:600}
.nt{font-size:.8rem;color:var(--mut);margin:0 0 12px}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scale(.6);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes up{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:.95}55%{transform:translate3d(16px,-300px,0)}100%{transform:translate3d(-10px,-620px,0);opacity:0}}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes shine{0%,62%{transform:translateX(-130%) skewX(-18deg)}100%{transform:translateX(260%) skewX(-18deg)}}

.fx i.c{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--aqua));box-shadow:inset 0 0 0 1.5px rgba(25,100,126,.4)}
@media(min-width:820px){.login{grid-template-columns:1.1fr 1fr}.lb{justify-content:flex-end;padding:56px}}
@media(max-width:520px){.v{grid-template-columns:1fr 1fr}.v .stk{grid-column:1/-1}.hd .ct{width:100%}.stat .big{font-size:1.8rem}.stat::after{display:none}.kp b{font-size:1.25rem}.tabs button{font-size:.88rem}.tabs button::before{display:none}.od{padding-left:20px}}

.cli{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.cli p{margin:2px 0}

  var $=function(s,r){return (r||document).querySelector(s)}, $$=function(s,r){return [].slice.call((r||document).querySelectorAll(s))};
  var reduz=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var raiz=document.documentElement;
  var temGsap=!!window.gsap&&!reduz;
  var camada=null;
  function fx(cls){
    if(!camada){camada=document.createElement('div');camada.className='fx';camada.setAttribute('aria-hidden','true');document.body.appendChild(camada)}
    var i=document.createElement('i'); i.className=cls; camada.appendChild(i); return i;
  }
  function burst(x,y,n){
    for(var k=0;k<n;k++){
      var i=fx(k%3===0?'c':'s'), a=Math.random()*Math.PI*2, d=40+Math.random()*80, s=.6+Math.random()*1;
      gsap.fromTo(i,{x:x,y:y,scale:0,rotation:0,opacity:1},{x:x+Math.cos(a)*d,y:y+Math.sin(a)*d-24,scale:s,rotation:(Math.random()-.5)*180,opacity:0,duration:.8+Math.random()*.5,ease:'power3.out',onComplete:function(){this.targets()[0].remove()}});
    }
  }
  var lerBRL=function(t){return parseFloat(String(t).replace(/[^\d,]/g,'').replace(',','.'))||0};
  var fmtBRL=function(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};

  // números que contam até o valor novo
  var anteriores={};
  function contar(chave,el){
    if(el._busy)return;
    var txt=el.textContent, moeda=/R\$/.test(txt), novo=moeda?lerBRL(txt):parseInt(txt,10);
    if(isNaN(novo))return;
    var de=anteriores[chave]; anteriores[chave]=novo;
    if(de===undefined)de=0;
    if(de===novo)return;
    el._busy=true;
    var o={v:de}, f=moeda?fmtBRL:function(v){return String(Math.round(v))};
    el.textContent=f(de);
    gsap.to(o,{v:novo,duration:.9,ease:'power2.out',onUpdate:function(){el.textContent=f(o.v)},onComplete:function(){el.textContent=f(novo);setTimeout(function(){el._busy=false},0)}});
    gsap.fromTo(el,{scale:1.12},{scale:1,duration:.6,ease:'back.out(3)',transformOrigin:'left center'});
  }
  // vendas: ao trocar de aba ou de período, recomeça do zero
  document.addEventListener('click',function(e){
    if(e.target.closest&&e.target.closest('.tabs button, #pr button'))for(var k in anteriores)if(k.indexOf('kp')===0)delete anteriores[k];
  },true);

  var vistos={}, ultimoStats=null, ultimoPs=null, ultimoKp=null, ultimoBadge='', logado=false;
  function varrer(){
    // tela de login: animação de entrada só na primeira vez
    var lg=$('.login');
    if(lg&&!logado){logado=true;setTimeout(function(){raiz.classList.add('ls')},1500)}
    if(!temGsap)return;

    // contadores dos filtros
    var st=$('#stats'), ps=$('#ps');
    if(st&&st!==ultimoStats){ultimoStats=st}
    if(ps&&ps!==ultimoPs){ultimoPs=ps}
    $$('#stats .big').forEach(function(el,i){contar('st'+i,el)});
    $$('#ps .big').forEach(function(el,i){contar('ps'+i,el)});

    // vendas
    var kp=$('.kp');
    if(kp)$$('b',kp).forEach(function(el,i){contar('kp'+i,el)});

    // pedidos: cada pedido entra uma vez só (os que já apareceram não repetem)
    var novos=$$('.od[data-id]').filter(function(c){var id=c.getAttribute('data-id'); if(vistos[id])return false; vistos[id]=1; return true});
    if(novos.length)gsap.fromTo(novos.slice(0,14),{y:26,opacity:0,scale:.98},{y:0,opacity:1,scale:1,duration:.6,ease:'power3.out',stagger:.07,clearProps:'transform,opacity'});

    // produtos: entram ao abrir a aba
    if(st&&!st._anim){st._anim=1; var prs=$$('.pr'); if(prs.length)gsap.fromTo(prs.slice(0,10),{y:22,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out',stagger:.05,clearProps:'transform,opacity'})}

    // selo de pedidos novos dá um pulo quando muda
    var nb=$('#nbp');
    if(nb){var t=nb.textContent; if(t!==ultimoBadge){ if(ultimoBadge!==''||t)gsap.fromTo(nb,{scale:1.7},{scale:1,duration:.6,ease:'back.out(3)'}); ultimoBadge=t}}
  }
  var agendado=false;
  function agendar(){if(agendado)return;agendado=true;requestAnimationFrame(function(){agendado=false;try{varrer()}catch(e){}})}
  new MutationObserver(agendar).observe(document.body,{childList:true,subtree:true});
  agendar();

  // novo pedido: toast ganha sino e a tela solta brilhos
  var toast=$('#st');
  if(toast){
    new MutationObserver(function(){
      var novo=toast.classList.contains('on')&&/^Novo pedido/.test(toast.textContent);
      toast.classList.toggle('novo',novo);
      if(novo===!!toast._n)return; toast._n=novo;
      if(novo&&temGsap){var r=toast.getBoundingClientRect(); burst(r.left+30,r.top+r.height/2,18)}
    }).observe(toast,{attributes:true,attributeFilter:['class']});
  }
})();
</script>

function stats(){if(!$("stats"))return;
  const n=prods.length,out=prods.filter(p=>p.vars.some(v=>e0(v)<=0)).length,low=prods.filter(p=>p.vars.some(v=>e0(v)>0&&e0(v)<=5)).length;
  const S=[["todos",n,"Produtos"],["baixo",low,"Estoque baixo"],["esgotado",out,"Com esgotado"]];
  $("stats").innerHTML=S.map(([k,v,t])=>`<button class="stat ${filtro===k?"on":""}" onclick="setF('${k}')"><span class="big">${v}</span><span>${t}</span></button>`).join("");

function lista(){if(!$("lista"))return;

  const ok=p=>p.nome.toLowerCase().includes(q)&&(filtro==="todos"||(filtro==="esgotado"&&p.vars.some(v=>e0(v)<=0))||(filtro==="baixo"&&p.vars.some(v=>e0(v)>0&&e0(v)<=5)));
  const cats=[...new Set(prods.map(p=>p.cat))];
  const h=prods.map((p,i)=>ok(p)?`<div class="pr"><div class="hd">
    <label class="fotob" title="Trocar a foto">${p.foto?`<img src="${esc(p.foto)}" alt="Foto de ${esc(p.nome)}">`:`<span>Adicionar foto</span>`}<input type="file" accept="image/*" hidden onchange="foto(${i},this)"></label>${p.foto?`<button class="del" onclick="setP(${i},'foto','');lista()">Tirar foto</button>`:""}
    <input class="nm" value="${esc(p.nome)}" aria-label="Nome" onchange="setP(${i},'nome',this.value)">
    <input class="ct" list="cats" placeholder="Categoria" value="${esc(p.cat)}" aria-label="Categoria" onchange="setP(${i},'cat',this.value)"></div>
    <div class="vs">${p.vars.map((v,j)=>{const e=e0(v),c=e<=0?"out":e<=5?"low":"";return `<div class="v">
      <div><label>Tamanho</label><input value="${esc(v.t)}" placeholder="Ex.: 5L" onchange="setV(${i},${j},'t',this.value)"></div>
      <div><label>Preço</label><div class="pre"><span>R$</span><input type="number" step="0.01" min="0" value="${v.p}" onchange="setV(${i},${j},'p',this.value)"></div></div>
      <div><label>Estoque</label><div class="stk"><button aria-label="Diminuir" onclick="step(${i},${j},-1)">−</button><input id="e_${i}_${j}" type="number" min="0" value="${e}" onchange="setV(${i},${j},'e',this.value)"><button aria-label="Aumentar" onclick="step(${i},${j},1)">+</button></div></div>
      <div class="tg"><span id="s_${i}_${j}"><i class="dot ${c}"></i>${e<=0?"Esgotado":e<=5?"Estoque baixo":"Em estoque"}</span>${p.vars.length>1?`<button class="del" onclick="delV(${i},${j})">Remover tamanho</button>`:""}</div></div>`}).join("")}</div>
    <div class="hd add"><button class="ghost" onclick="addV(${i})">Adicionar tamanho</button><button class="del" style="margin-left:auto" onclick="remover(${i})">Remover produto</button></div></div>`:"").join("");
  $("lista").innerHTML=(h.trim()?h:prods.length?`<div class="empty"><h2>Nada encontrado</h2>Mude a busca ou o filtro acima.</div>`:`<div class="empty"><h2>Nenhum produto ainda</h2><p>Comece com os produtos que já combinamos ou crie o primeiro.</p><button class="btn" onclick="importar()">Importar produtos iniciais</button></div>`)+`<datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>`;
  stats();
}
function panel(){

  <nav class="tabs"><button id="t_p" onclick="setAba('pedidos')">Pedidos<b id="nbp"></b></button><button id="t_r" onclick="setAba('produtos')">Produtos</button><button id="t_v" onclick="setAba('vendas')">Vendas</button><button id="t_c" onclick="setAba('clientes')">Clientes</button></nav><main class="wrap" id="mn"></main>`;

    <label class="chk"><input type="checkbox" ${loja.fechado?"checked":""} onchange="setLoja('fechado',this.checked)"> Fechar a loja agora (o site para de aceitar pedidos)</label></div></details>
  <div class="tools"><input type="search" id="bq" placeholder="Buscar produto" aria-label="Buscar produto" value="${esc(busca)}"><button class="btn" onclick="novo()">Novo produto</button></div>

/* ---- vendas ---- */
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
let per=7;
function vendasView(){
  $("mn").innerHTML=`<div class="seg2" id="pr"><button data-d="1">Hoje</button><button data-d="7">7 dias</button><button data-d="30">30 dias</button></div><div class="row" style="margin-bottom:12px"><button class="ghost" onclick="exportar()">Baixar planilha deste período</button></div><div id="rv"></div>`;
  document.querySelectorAll("#pr button").forEach(b=>{b.classList.toggle("on",+b.dataset.d===per);b.onclick=()=>{per=+b.dataset.d;vendasView()}});
  relat();
}
function relat(){
  if(!$("rv"))return;
  const ini=new Date();ini.setHours(0,0,0,0);ini.setDate(ini.getDate()-(per-1));
  const v=pedidos.filter(o=>o.criadoEm>=ini.getTime()&&["confirmado","entrega","entregue"].includes(o.status));
  const tot=v.reduce((a,o)=>a+(o.total||0),0),n=v.length;
  const dias=[];for(let i=0;i<per;i++){const d=new Date(ini);d.setDate(d.getDate()+i);dias.push({d,t:0})}
  v.forEach(o=>{const d=new Date(o.criadoEm);d.setHours(0,0,0,0);const x=dias.find(y=>y.d.getTime()===d.getTime());if(x)x.t+=o.total||0});
  const mx=Math.max(1,...dias.map(x=>x.t));
  const agr=(f)=>{const m={};v.forEach(o=>f(o).forEach(([k,q,val])=>{m[k]=m[k]||{q:0,val:0};m[k].q+=q;m[k].val+=val}));return Object.entries(m).sort((a,b)=>b[1].q-a[1].q).slice(0,6)};
  const prod=agr(o=>(o.itens||[]).map(i=>[i.nome,i.q,i.q*i.p]));
  const bai=agr(o=>[[(o.cliente||{}).bairro||"Sem bairro",1,o.total||0]]);
  const rk=(l,u)=>l.length?l.map(([k,x])=>`<div class="rk"><span>${esc(k)}</span><span>${u(x)}</span><u><i style="width:${Math.round(x.q/l[0][1].q*100)}%"></i></u></div>`).join(""):`<p class="nt">Sem vendas neste período.</p>`;
  const din=v.filter(o=>o.pag==="Dinheiro").length;
  const av=pedidos.filter(o=>o.nota&&o.criadoEm>=ini.getTime()),media=av.length?av.reduce((a,o)=>a+o.nota,0)/av.length:0;
  const baixo=[];prods.forEach(p=>p.vars.forEach(x=>{if(e0(x)<=5)baixo.push([(p.nome+" "+(x.t||"")).trim(),e0(x)])}));baixo.sort((a,b)=>a[1]-b[1]);
  $("rv").innerHTML=`<div class="kp"><div><b>${brl(tot)}</b><span>Vendido</span></div><div><b>${n}</b><span>${n===1?"Pedido":"Pedidos"}</span></div><div><b>${brl(n?tot/n:0)}</b><span>Ticket médio</span></div></div>
  <p class="nt">Contam os pedidos confirmados, a caminho e entregues. Novos e cancelados ficam de fora.${pedidos.length>=400?" Mostrando só os últimos 400 pedidos.":""}</p>
  ${per>1?`<div class="bx"><h3>Vendas por dia</h3><div class="bars">${dias.map((x,n)=>`<div title="${x.d.toLocaleDateString("pt-BR")}: ${brl(x.t)}"><i style="--n:${n};height:${Math.round(x.t/mx*100)}%"></i><small>${per<=7?x.d.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""):(x.d.getDate()%5===0?x.d.getDate():"")}</small></div>`).join("")}</div></div>`:""}
  <div class="bx"><h3>Mais vendidos</h3>${rk(prod,x=>x.q+" un. · "+brl(x.val))}</div>
  <div class="bx"><h3>Bairros que mais pedem</h3>${rk(bai,x=>x.q+(x.q===1?" pedido":" pedidos"))}</div>
  <div class="bx"><h3>Pagamento</h3><p style="margin:0">Dinheiro: <b>${din}</b> &nbsp; Pix: <b>${n-din}</b></p></div>
  <div class="bx"><h3>Avaliações dos clientes</h3>${av.length?`<p style="margin:0 0 8px"><b>${media.toFixed(1).replace(".",",")} de 5</b> em ${av.length} ${av.length>1?"avaliações":"avaliação"}</p>`+av.filter(o=>o.comentario).slice(0,5).map(o=>`<p class="nt" style="margin:0 0 6px">${"★".repeat(o.nota)} ${esc(o.comentario)} - ${esc((o.cliente||{}).nome)}</p>`).join(""):`<p class="nt">Ainda sem avaliações neste período.</p>`}</div>
  <div class="bx"><h3>Acabando no estoque</h3>${baixo.length?baixo.slice(0,10).map(([k,q])=>`<div class="rk"><span>${esc(k)}</span><span>${q?q+" un.":"Esgotado"}</span></div>`).join("")+`<button class="ghost" onclick="setAba('produtos')">Ajustar estoque</button>`:`<p class="nt">Nenhum produto com estoque baixo.</p>`}</div>`;
}
/* ---- pedidos ---- */
const ST={novo:"Novo",confirmado:"Confirmado",entrega:"Saiu para entrega",entregue:"Entregue",cancelado:"Cancelado"};
const grp=s=>s==="novo"?"novo":(s==="confirmado"||s==="entrega")?"andamento":"final";
function pedidosView(){
  const perm=typeof Notification!=="undefined"?Notification.permission:"denied";
  $("mn").innerHTML=`<div class="stats" id="ps"></div><div class="tools2"><button class="ghost" id="sm">${som?"Som do aviso: ligado":"Som do aviso: desligado"}</button><button class="ghost" id="nt">${perm==="granted"?"Avisos do navegador: ativos":"Ativar avisos do navegador"}</button></div><div id="pl"></div>`;
  $("sm").onclick=()=>{som=!som;if(som)beep();pedidosView()};
  $("nt").onclick=async()=>{if(typeof Notification!=="undefined"){await Notification.requestPermission();pedidosView()}};
  listaPed();
}
function listaPed(){
